<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.5 -2.5 48 48">
  <!-- viewBox is offset by half a unit so 1-unit strokes on integer coords land on whole pixels at 48px -->
  <defs>
    <!-- envelope silhouette: roof + body -->
    <path id="env" d="M1.2 14.6l19-14C20.7.2 21.3 0 22 0s1.3.2 1.8.6l19 14c.7.5 1.2 1.4 1.2 2.4v21c0 1.7-1.3 3-3 3H3c-1.7 0-3-1.3-3-3V17c0-1 .5-1.9 1.2-2.4z"/>
    <path id="check" d="M16.5 11.5L14 14l8 8L38.5 5.5 36 3 22 17z"/>
    <clipPath id="envClip"><use href="#env"/></clipPath>

    <filter id="shadow" filterUnits="userSpaceOnUse" x="-1.5" y="-2.5" width="48" height="48">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".5"/>
      <feOffset dx=".7" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
    </filter>

    <!-- inside of the envelope: deep, shadowed blue -->
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ef0"/>
      <stop offset=".55" stop-color="#2459c9"/>
      <stop offset="1" stop-color="#123a9c"/>
    </linearGradient>
    <!-- front pocket flaps: bright Luna sky blue -->
    <linearGradient id="flapL" x1="0" y1="17" x2="0" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fd6ff"/>
      <stop offset=".5" stop-color="#2aa8f2"/>
      <stop offset="1" stop-color="#0a6fcc"/>
    </linearGradient>
    <linearGradient id="flapR" x1="0" y1="17" x2="0" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4efff"/>
      <stop offset=".5" stop-color="#62c6fa"/>
      <stop offset="1" stop-color="#2493e0"/>
    </linearGradient>
    <!-- glossy white check with a cool grey underside -->
    <linearGradient id="checkFill" x1="0" y1="3" x2="0" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".5" stop-color="#f1f4f9"/>
      <stop offset="1" stop-color="#c9d1de"/>
    </linearGradient>
    <!-- top-down gloss sheen -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <!-- inner bevel: bright along the top, fading out toward the bottom -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="41" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".15"/>
    </linearGradient>
  </defs>

  <!-- drop shadow drawn from a silhouette, so only it goes through the filter;
       WebKit rasterizes filtered content at low resolution, which blurred the whole icon -->
  <g filter="url(#shadow)">
    <use href="#env"/>
    <use href="#check" transform="translate(26.25 12.5) scale(1.15) translate(-26.25 -12.5)" stroke="#000" stroke-width=".87" stroke-linejoin="round"/>
  </g>

  <g>
    <!-- envelope interior (roof + back wall) -->
    <use href="#env" fill="url(#inside)"/>

    <g clip-path="url(#envClip)">
      <!-- soft sheen on the roof -->
      <path d="M2 15.2L21 1.4c.6-.4 1.4-.4 2 0l19 13.8c-6 1.6-13 2.4-20 2.4S8 16.8 2 15.2z" fill="url(#gloss)" opacity=".55"/>

      <!-- roof fold behind the check: dark crease with a light bevel just below -->
      <path d="M0 17h44" stroke="#0a2f80" stroke-width="1"/>
      <path d="M0 18h44" stroke="#fff" stroke-opacity=".45" stroke-width="1"/>

      <!-- front pocket -->
      <path d="M0 17v21c0 1.7 1.3 3 3 3h38z" fill="url(#flapL)"/>
      <path d="M44 17v21c0 1.7-1.3 3-3 3H3z" fill="url(#flapR)"/>
      <!-- top fold: dark crease with a light bevel just below -->
      <path d="M0 17l22 13L44 17" fill="none" stroke="#0b3f8f" stroke-width="1" stroke-linejoin="round"/>
      <path d="M0 18l22 13L44 18" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1" stroke-linejoin="round"/>
      <!-- lower crease: edge of the right flap, which overlaps the left -->
      <path d="M3 41l19-11" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1" transform="translate(0 1)"/>
      <path d="M3 41l19-11" fill="none" stroke="#0b4a9a" stroke-opacity=".85" stroke-width="1"/>

      <!-- glassy highlight across the upper half of the pocket -->
      <path d="M-1 18.5l23 13 23-13V26c-7 3.5-15 5-23 5S6 29.5-1 26z" fill="#fff" opacity=".18"/>
      <!-- inner bevel: double-width stroke clipped to the silhouette, so exactly 1 unit shows inside the edge -->
      <use href="#env" fill="none" stroke="url(#bevel)" stroke-width="3"/>
    </g>

    <!-- crisp dark navy outline -->
    <use href="#env" fill="none" stroke="#0a2a6e" stroke-width="1" stroke-linejoin="round"/>

    <!-- checkmark, scaled up 15% around its centre; stroke compensated to stay 1 unit -->
    <g transform="translate(26.25 12.5) scale(1.15) translate(-26.25 -12.5)">
      <use href="#check" fill="url(#checkFill)" stroke="#3f5378" stroke-width=".87" stroke-linejoin="round"/>
      <path d="M15.2 14l1.3-1.3 5.5 5.5L36 4.2l1.2 1.2L36 4.6 22 18.6z" fill="#fff" opacity=".9"/>
    </g>
  </g>
</svg>
